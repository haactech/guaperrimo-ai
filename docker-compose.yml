services:
  app:
    build: .
    container_name: guaperrimo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      POSTGRES_URL: "postgres://guaperrimo:guaperrimo@postgres:5432/guaperrimo?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: guaperrimo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "guaperrimo"
      POSTGRES_USER: "guaperrimo"
      POSTGRES_PASSWORD: "guaperrimo"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guaperrimo -d guaperrimo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
